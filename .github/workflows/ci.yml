name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze and test
        shell: pwsh
        run: ./build.ps1 -Task Test -Coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            coverage.xml

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Force -Scope CurrentUser

      - name: Build exe
        shell: pwsh
        run: ./build.ps1 -Task Build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PSGUI-dist
          path: |
            dist/PSGUI.exe
            dist/icon.ico
            dist/defaultsettings.json
            dist/Assembly/
