name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          function Install-Retry {
            param([string]$Name, [hashtable]$Params = @{})
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module -Name $Name @Params -Force -Scope CurrentUser -ErrorAction Stop; return }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds (5 * $i) }
            }
          }
          Install-Retry Pester @{ MinimumVersion = '5.5'; SkipPublisherCheck = $true }
          Install-Retry PSScriptAnalyzer

      - name: Analyze and test
        shell: pwsh
        run: ./build.ps1 -Task Test -Coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            coverage.xml

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: pwsh
        run: |
          function Install-Retry {
            param([string]$Name, [hashtable]$Params = @{})
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module -Name $Name @Params -Force -Scope CurrentUser -ErrorAction Stop; return }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds (5 * $i) }
            }
          }
          Install-Retry ps2exe

      - name: Build exe
        shell: pwsh
        run: ./build.ps1 -Task Build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PSGUI-dist
          path: |
            dist/PSGUI.exe
            dist/icon.ico
            dist/defaultsettings.json
            dist/Assembly/
