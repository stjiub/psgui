name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $match = Select-String -Path src/Main.ps1 -Pattern '^\$script:Version\s*=\s*"([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match src/Main.ps1 version $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          function Install-Retry {
            param([string]$Name, [hashtable]$Params = @{})
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module -Name $Name @Params -Force -Scope CurrentUser -ErrorAction Stop; return }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds (5 * $i) }
            }
          }
          Install-Retry Pester @{ MinimumVersion = '5.5'; SkipPublisherCheck = $true }
          Install-Retry PSScriptAnalyzer
          Install-Retry ps2exe

      - name: Test
        shell: pwsh
        run: ./build.ps1 -Task Test

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Task Build

      - name: Package
        shell: pwsh
        run: |
          $zip = "PSGUI-$env:VERSION.zip"
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/PSGUI.exe, dist/icon.ico, dist/defaultsettings.json, LICENSE, THIRD-PARTY.md -Destination package
          Copy-Item dist/Assembly -Destination package/Assembly -Recurse
          Compress-Archive -Path package/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Set-Content "$zip.sha256"

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $header = "^## $([regex]::Escape($version))(\s|$)"
          $start = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match $header } | Select-Object -First 1
          if ($null -eq $start) { throw "No '## $version' section in CHANGELOG.md" }

          $body = foreach ($line in $lines[($start + 1)..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $line
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "The '## $version' section in CHANGELOG.md is empty" }
          Set-Content -Path release-notes.md -Value $text

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            PSGUI-${{ env.VERSION }}.zip
            PSGUI-${{ env.VERSION }}.zip.sha256
